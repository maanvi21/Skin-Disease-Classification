<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Disease Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e1b4b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .upload-area {
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-area input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
        }

        .btn-predict {
            background: var(--primary);
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 15px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-predict:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 20px -3px rgba(99, 102, 241, 0.5);
        }

        .btn-predict:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.7;
        }

        #preview-container {
            display: none;
            margin: 20px auto;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            max-width: 350px;
        }

        #preview {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Results Section */
        #result {
            display: none;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid var(--glass-border);
            animation: fadeIn 0.6s ease-out;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #818cf8;
            margin-bottom: 5px;
        }

        .metric-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .advice-card {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .heatmap-container {
            margin: 0 auto;
            max-width: 450px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(168, 85, 247, 0.5);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            background: #000;
        }

        .heatmap-container h3 {
            margin: 0;
            padding: 10px;
            background: rgba(168, 85, 247, 0.2);
            font-size: 1rem;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.3);
        }

        #heatmap {
            width: 100%;
            display: block;
        }

        /* Loader */
        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .metrics-grid { grid-template-columns: 1fr; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Skin Disease AI Diagnostic</h1>
        <p class="subtitle">Upload a dermatological image for advanced neural architecture analysis and Grad-CAM interpretability.</p>

        <form id="uploadForm" enctype="multipart/form-data">
            <div class="upload-area" id="drop-zone">
                <span class="upload-icon">📸</span>
                <p id="upload-text">Drag and drop an image here or click to browse</p>
                <input type="file" id="image" name="image" accept="image/*" required>
            </div>
            
            <div id="preview-container">
                <img id="preview" alt="Image Preview">
            </div>

            <button type="button" class="btn-predict" id="predictBtn" onclick="uploadImage()" disabled>
                <span>Analyze Lesion</span>
                <div class="loader" id="loader"></div>
            </button>
        </form>

        <div id="result">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-value" id="prediction">--</div>
                    <div class="metric-label">Predicted Class</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="confidence">--%</div>
                    <div class="metric-label">Confidence</div>
                </div>
            </div>

            <div class="advice-card" id="message">
                Analyzing implications...
            </div>

            <div class="heatmap-container">
                <h3>GRADIENT-WEIGHTED CLASS ACTIVATION MAPPING (Grad-CAM)</h3>
                <img id="heatmap" alt="Grad-CAM Hotspots">
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('image');
        const previewContainer = document.getElementById('preview-container');
        const preview = document.getElementById('preview');
        const predictBtn = document.getElementById('predictBtn');
        const uploadText = document.getElementById('upload-text');
        const dropZone = document.getElementById('drop-zone');

        // Drag and drop effects
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        });

        fileInput.addEventListener('change', function(e) {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    fileInput.files = files; // Ensure the form sees the dropped file
                    preview.src = URL.createObjectURL(file);
                    previewContainer.style.display = 'block';
                    uploadText.innerText = file.name;
                    predictBtn.disabled = false;
                    document.getElementById('result').style.display = 'none';
                }
            }
        }

        async function uploadImage() {
            if (fileInput.files.length === 0) return;

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            // UI Loading state
            const loader = document.getElementById('loader');
            const btnText = predictBtn.querySelector('span');
            predictBtn.disabled = true;
            loader.style.display = 'block';
            btnText.innerText = 'Processing...';
            document.getElementById('result').style.display = 'none';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.error) {
                    alert('Error: ' + data.error);
                } else {
                    // Show results
                    document.getElementById('result').style.display = 'block';
                    
                    // Format prediction text (replace underscores with spaces)
                    const formattedPrediction = data.prediction.replace(/_/g, ' ');
                    document.getElementById('prediction').innerText = formattedPrediction;
                    
                    document.getElementById('confidence').innerText = data.confidence + '%';
                    document.getElementById('message').innerText = data.message;
                    document.getElementById('heatmap').src = data.heatmap;
                    
                    // Style advice card based on risk
                    const adviceCard = document.getElementById('message');
                    if (data.message.includes('High risk')) {
                        adviceCard.style.background = 'rgba(239, 68, 68, 0.1)';
                        adviceCard.style.border = '1px solid rgba(239, 68, 68, 0.2)';
                        adviceCard.style.color = '#fecaca';
                    } else if (data.message.includes('fungal')) {
                        adviceCard.style.background = 'rgba(245, 158, 11, 0.1)';
                        adviceCard.style.border = '1px solid rgba(245, 158, 11, 0.2)';
                        adviceCard.style.color = '#fde68a';
                    } else {
                        adviceCard.style.background = 'rgba(16, 185, 129, 0.1)';
                        adviceCard.style.border = '1px solid rgba(16, 185, 129, 0.2)';
                        adviceCard.style.color = '#a7f3d0';
                    }
                }
            } catch (err) {
                alert('Connection failure or server error.');
                console.error(err);
            } finally {
                // Restore button state
                predictBtn.disabled = false;
                loader.style.display = 'none';
                btnText.innerText = 'Analyze Lesion';
            }
        }
    </script>
</body>
</html>
